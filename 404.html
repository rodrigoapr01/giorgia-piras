<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Giorgia Piras · Personal Trainer a Roma</title>
  <meta name="description" content="Il sito di Giorgia Piras, personal trainer a Roma, è in aggiornamento. Per qualsiasi cosa scrivile su WhatsApp." />
  <meta property="og:title" content="Giorgia Piras · Personal Trainer a Roma" />
  <meta property="og:description" content="Il sito è in allenamento. Torna tra poco, intanto scrivimi su WhatsApp." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lapiras.it/" />
  <meta name="theme-color" content="#0a0a0a" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" />

  <style>
    :root {
      --black:    #0a0a0a;
      --gold:     #c9a96e;
      --gold-dim: rgba(201,169,110,0.15);
      --white:    #ffffff;
      --white-60: rgba(255,255,255,0.6);
      --white-10: rgba(255,255,255,0.1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--black);
      color: var(--white);
      font-family: 'Outfit', Arial, Helvetica, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      padding:
        calc(32px + env(safe-area-inset-top))
        calc(24px + env(safe-area-inset-right))
        calc(20px + env(safe-area-inset-bottom))
        calc(24px + env(safe-area-inset-left));
    }

    a { color: inherit; text-decoration: none; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 0;
    }

    .wordmark {
      font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.4em;
      margin-right: -0.4em; /* compensa il tracking finale per centrare otticamente */
      color: var(--gold);
      margin-bottom: 40px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--white-60);
      margin-bottom: 20px;
    }

    .dot {
      position: relative;
      width: 8px;
      height: 8px;
      flex-shrink: 0;
    }
    .dot::before,
    .dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--gold);
    }
    .dot::after {
      animation: pulse 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(2.8); opacity: 0; }
    }

    h1 {
      font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 15vw, 7.5rem);
      line-height: 0.9;
      letter-spacing: 0.01em;
      color: var(--white);
      text-align: center;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--white-60);
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--gold);
      border: 0;
      margin: 32px auto;
    }

    .lead {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--white);
      margin-bottom: 24px;
      max-width: 30ch;
    }

    .btn-gold {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      min-height: 56px;
      padding: 16px 28px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Outfit', Arial, Helvetica, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: opacity 0.25s, background-color 0.25s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn-gold svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: currentColor;
    }
    .btn-gold:active { opacity: 0.85; }
    .btn-gold:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 4px;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: var(--white-60);
      padding-top: 24px;
    }
    footer a {
      color: var(--white);
      text-decoration: underline;
      text-decoration-color: var(--gold);
      text-underline-offset: 3px;
    }
    footer a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .btn-gold:hover { opacity: 0.88; }
      footer a:hover { color: var(--gold); }
    }

    @media (min-width: 768px) {
      body {
        padding-top: calc(56px + env(safe-area-inset-top));
        padding-bottom: calc(32px + env(safe-area-inset-bottom));
      }
      main { padding: 48px 0; }
      .wordmark { font-size: 1.25rem; margin-bottom: 64px; }
      .status { font-size: 0.75rem; margin-bottom: 28px; }
      h1 { margin-bottom: 28px; }
      .subtitle { font-size: 1.2rem; }
      .divider { margin: 44px auto; }
      .lead { font-size: 1.1rem; max-width: none; margin-bottom: 32px; }
      .btn-gold { width: auto; padding: 18px 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot::after { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="wordmark">Giorgia Piras</p>

    <p class="status"><span class="dot" aria-hidden="true"></span>Lavori in corso</p>

    <h1>Il sito è in allenamento.</h1>

    <p class="subtitle">Lo sto rimettendo in forma. Torna tra poco.</p>

    <hr class="divider" />

    <p class="lead">Nel frattempo ci sono io: se hai bisogno, scrivimi qui.</p>

  </main>

  </footer>
</body>
</html>
